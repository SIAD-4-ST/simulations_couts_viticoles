<!DOCTYPE html>
<!--
  OAD coûts techniques — vignoble champenois
  Plan du fichier (chercher le repère avec grep -n "SECTION") :
    SECTION STYLE      jetons de couleur (clair/sombre), typographie et mise en page
    SECTION PAGE       en-tête collant (titre, profil, KPI, méthode, onglets), zone principale
    SECTION MOTEUR     script id="moteur" : calcul pur (Core) + cas de validation. Aucun accès au DOM.
    SECTION INTERFACE  script id="interface" : rendu, édition, export. Aucune formule métier.
  Données : data/referentiel.js (chargé avant le moteur). Tests : node --test (dossier tests/).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAD Coûts techniques — vignoble champenois</title>
<!-- ================= SECTION STYLE ================= -->
<style>
:root{
--bg:#EEF0EA;--surface:#FFFFFF;--ink:#1E2621;--muted:#5C665E;--line:#D3D8CE;--soft:#F6F7F3;
--vine:#4F6B2C;--slate:#3E5C76;--ochre:#A9822A;--lie:#7A2E4A;--warn:#A4441C;--flag:#FBF1E6;
--line-soft:#F0F2EC;--field:#E3E7DF;--on-accent:#F3F6EC;--vine-strong:#3A4F20;--dim:#B4BDB4;--flag-soft:#FCFBF7;
--fam-1:#4F6B2C;--fam-2:#3E5C76;--fam-3:#A9822A;--fam-4:#7A2E4A;--fam-5:#6B7F4A;--fam-6:#5A7D96;--fam-7:#8C6A2E;--fam-8:#96566D;--fam-9:#7E9455;
--serif:ui-serif,Georgia,"Times New Roman",serif;
--sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
--mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#131815;--surface:#1B211D;--ink:#E4E9E1;--muted:#9AA59B;--line:#2E3731;--soft:#171C18;
--vine:#93B862;--slate:#86A9C6;--ochre:#D5B25C;--lie:#CC84A2;--warn:#E48A5E;--flag:#2E2419;
--line-soft:#232B26;--field:#2A322C;--on-accent:#202A1C;--vine-strong:#A8C97A;--dim:#5A655C;--flag-soft:#20261F;
--fam-1:#93B862;--fam-2:#86A9C6;--fam-3:#D5B25C;--fam-4:#CC84A2;--fam-5:#A9C67F;--fam-6:#9BBBD3;--fam-7:#C7A76A;--fam-8:#BF8FA4;--fam-9:#B5CC93;
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#131815;--surface:#1B211D;--ink:#E4E9E1;--muted:#9AA59B;--line:#2E3731;--soft:#171C18;
--vine:#93B862;--slate:#86A9C6;--ochre:#D5B25C;--lie:#CC84A2;--warn:#E48A5E;--flag:#2E2419;
--line-soft:#232B26;--field:#2A322C;--on-accent:#202A1C;--vine-strong:#A8C97A;--dim:#5A655C;--flag-soft:#20261F;
--fam-1:#93B862;--fam-2:#86A9C6;--fam-3:#D5B25C;--fam-4:#CC84A2;--fam-5:#A9C67F;--fam-6:#9BBBD3;--fam-7:#C7A76A;--fam-8:#BF8FA4;--fam-9:#B5CC93;
color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--serif);font-weight:500;margin:0}
h1{font-size:26px;line-height:1.15;letter-spacing:-.01em}
h2{font-size:18px}
.wrap{max-width:1560px;margin:0 auto;padding-left:clamp(16px,3vw,36px);padding-right:clamp(16px,3vw,36px)}

/* ---- en-tête ---- */
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(30,38,33,.03)}
header .wrap{padding-top:18px}
.top{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-start;justify-content:space-between}
.title{min-width:min(100%,340px)}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{width:10px;height:10px;border-radius:2px;background:var(--vine);flex:none}
.sub{margin:6px 0 0;font-size:13px;color:var(--muted);max-width:62ch}
.pick{display:flex;flex-direction:column;gap:8px;min-width:min(100%,420px);flex:1 1 380px}
.pick-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pick-t label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pick-t span{font-size:12px;color:var(--muted)}
#prof{width:100%;font-size:14px;padding:9px 12px;border-radius:6px;border-color:var(--line)}
.faits{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted)}
.faits b{color:var(--ink);font-family:var(--mono);font-weight:600}
.faits b.t{font-family:var(--sans)}

#kpis{display:grid;grid-template-columns:minmax(260px,1.15fr) repeat(4,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:20px}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .v{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.kpi .l{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.kpi.main{background:var(--soft);padding:16px 20px}
.kpi.main .v{display:inline;font-family:var(--serif);font-size:40px;line-height:1;color:var(--vine)}
.kpi.main .u{font-size:13px;color:var(--muted);margin-left:8px}
.kpi.marge .v{color:var(--slate)}
.badge{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:var(--flag);border:1px solid var(--line);color:var(--warn);font-size:12px;padding:3px 8px;border-radius:999px}
.badge b{font-family:var(--mono);font-weight:600}
.badge span{color:var(--muted)}

.meth{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin-top:14px}
.meth .t{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--vine)}
.chip .g{color:var(--muted)}
.chip b{font-weight:600}
.ctx{font-size:12px;color:var(--muted);font-family:var(--mono)}

nav#tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
nav#tabs button{border:0;background:none;font:inherit;font-size:13.5px;padding:11px 14px;color:var(--muted);border-bottom:2px solid transparent;border-radius:0;cursor:pointer;white-space:nowrap}
nav#tabs button:hover{color:var(--ink);border-bottom-color:var(--line)}
nav#tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--vine)}
nav#tabs .n{margin-left:7px;font-size:11px;font-family:var(--mono);color:var(--muted)}
main{padding-top:24px;padding-bottom:72px}

/* ---- cartes et grilles ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.card-f{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 24px}
.card-f b{color:var(--ink);font-family:var(--mono);font-weight:600}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.g-scen{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px;align-items:start}
.g-debit{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.hd .m,.note{font-size:12px;color:var(--muted)}
.note{margin:0 0 12px;max-width:74ch}
.mt{margin-top:20px}
.mt2{margin:26px 0 4px}

/* ---- composition ---- */
.stack{display:flex;height:40px;border-radius:5px;overflow:hidden;background:var(--soft)}
.stack span{display:flex;align-items:center;justify-content:center;color:var(--surface);font-size:11.5px;font-weight:600;letter-spacing:.02em;overflow:hidden}
.c-mo{background:var(--vine)}.c-ma{background:var(--slate)}.c-in{background:var(--ochre)}.c-pr{background:var(--lie)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 24px;margin:14px 0 0;list-style:none;padding:0}
.legend li{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.legend i{width:10px;height:10px;border-radius:2px;flex:none}
.legend b{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600}
.legend em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);width:3.4em;text-align:right}
.fam{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.fam li{display:grid;grid-template-columns:minmax(7em,13em) minmax(0,1fr) 6.2em 3.4em;gap:12px;align-items:center;font-size:13px}
.fam li>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fam b{text-align:right;font-family:var(--mono);font-weight:600}
.fam em{font-style:normal;text-align:right;font-family:var(--mono);color:var(--muted);font-size:12px}
.bar{height:9px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:2px;background:var(--vine)}

/* ---- petite table de carte ---- */
.mini th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 7px}
.mini th.r,.mini td.r{text-align:right}
.mini td{font-size:13px;padding:7px 0;border-top:1px solid var(--line-soft)}
.mini td.r{font-family:var(--mono);color:var(--muted)}
.mini td.r.b{color:var(--ink);font-weight:600}
.acc{color:var(--slate)}

/* ---- alertes ---- */
.alert-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--flag)}
.alert-h .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--warn);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.alerts{list-style:none;margin:0;padding:6px 0}
.alerts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:11px 20px;border-bottom:1px solid var(--line-soft);align-items:start}
.alerts li:last-child{border-bottom:0}
.lvl{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 6px;white-space:nowrap;margin-top:1px}
.lvl.reg{color:var(--warn)}.lvl.don{color:var(--ochre)}.lvl.met{color:var(--slate)}.lvl.per{color:var(--muted)}
.alerts .tx{font-size:13px;line-height:1.5}
.alerts .or{font-size:12px;color:var(--muted);margin-top:3px}

/* ---- boutons et champs ---- */
button,.btn{font:inherit;font-size:12.5px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--vine)}
button.pri{background:var(--vine);border-color:var(--vine);color:var(--surface)}
button.pri:hover{background:var(--vine-strong);border-color:var(--vine-strong)}
button.on{border-color:var(--vine);background:var(--on-accent)}
button.danger{color:var(--warn)}
button:disabled{opacity:.45;cursor:not-allowed}
button.x{padding:3px 7px;font-size:11.5px;color:var(--muted);border-color:transparent;background:none;border-radius:4px}
button.x:hover{border-color:var(--line);color:var(--warn)}
:focus-visible{outline:2px solid var(--vine);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--field);border-radius:6px;padding:5px 8px;max-width:100%}
input:hover,select:hover,input:focus,select:focus{border-color:var(--vine)}
input.n{font-family:var(--mono);text-align:right;width:5.4em;padding:4px 7px;border-radius:5px}
input.xs{width:3.8em}
.w6{width:6em}.w8{width:9em}.w9{width:11em}.w12{width:13em}.w14{width:17em}.w16{width:20em}
.filtre{width:16em}.filtre.lg{width:18em}
.sl{border-color:transparent;background:none;padding:3px 5px}
.sl:hover,.sl:focus{border-color:var(--vine)}

/* ---- tables ---- */
.scroll{overflow-x:auto}
.scroll.tall{overflow-y:auto;max-height:70vh}
.scroll.mid{overflow-y:auto;max-height:60vh}
table{border-collapse:collapse;width:100%}
.data th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
.data td{padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
.data .r{text-align:right}
.data td.r{font-family:var(--mono);font-size:13px}
.data .b{font-weight:600;font-size:13.5px}
.data tr.flag td{background:var(--flag)}
.data tr.soft td{background:var(--flag-soft)}
.data tfoot td{background:var(--soft);border-top:1px solid var(--line);border-bottom:0;font-weight:600;padding:12px}
.data.wide{min-width:1040px}
.data.wider{min-width:1340px}
.data.w980{min-width:980px}
.data.w820{min-width:820px}
.z{color:var(--dim)}.mut{color:var(--muted)}.ko{color:var(--warn)}.ok{color:var(--vine)}.mid-c{color:var(--ochre)}
.mono{font-family:var(--mono)}
.nw{white-space:nowrap}
.long{max-width:30ch;font-size:11.5px;color:var(--muted)}
.long.lg{max-width:34ch}
.cut{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pas{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.famc{display:inline-flex;align-items:center;gap:7px}
.opc{display:flex;align-items:center;gap:9px}
.opc .f{width:4px;height:22px;border-radius:2px;flex:none}
.op-sel{font-size:13.5px;font-weight:500;max-width:24em}
.meta{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.srcl{font-size:11.5px;color:var(--muted);margin:5px 0 0 13px;max-width:52ch}
.srcl.no{color:var(--warn)}
.facettes{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--soft)}
.fac{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.fac.on{background:var(--vine);border-color:var(--vine);color:var(--surface)}
.fac .n{color:var(--muted);margin-left:6px;font-family:var(--mono)}
.fac.on .n{color:var(--surface)}

/* ---- barèmes : main-d'œuvre ---- */
.mogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.mo{border:1px solid var(--field);border-radius:8px;padding:13px 15px}
.mo.presta{background:var(--flag-soft)}
.mo-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mo-t .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mo .rate{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--vine)}
.mo.presta .rate{color:var(--ochre)}
.mo .u{font-size:12px;color:var(--muted)}
.mo .d{font-size:12px;color:var(--muted);margin-top:8px;font-family:var(--mono);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mo .rq{font-size:12px;color:var(--muted);margin-top:6px}
.mo-t input{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600}
.mo .rq input{width:100%;font-size:12px;color:var(--muted)}
.famc input{min-width:0}
.cut select{max-width:16ch}

/* ---- lignes libellé / valeur ---- */
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.row .l{font-size:13.5px;font-weight:500}
.row .s{font-size:12px;color:var(--muted);margin-top:3px;max-width:52ch}
.row .v{display:flex;align-items:baseline;gap:7px}
.row .u{font-size:12px;color:var(--muted);width:4.5em}
.row.fld{align-items:center;padding:8px 0}
.row.fld .l{font-size:13px;font-weight:400}
.row.fld .u{width:4.2em}

/* ---- méthodes et comparateur ---- */
.meths{display:flex;flex-direction:column;gap:10px}
.mth{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:13px 15px;border:1px solid var(--field);border-radius:8px;text-align:left;background:var(--surface);cursor:pointer;width:100%}
.mth.on{border-color:var(--vine);background:var(--on-accent)}
.mth .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--field);margin-top:3px}
.mth.on .dot{border-color:var(--vine);background:var(--vine)}
.mth .t{display:block;font-size:13.5px;font-weight:600}
.mth .d{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.mth .k{display:block;font-family:var(--mono);font-size:12px;color:var(--slate);margin-top:6px}
.cmps{display:flex;flex-direction:column;gap:8px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px;border:1px solid var(--field);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer;width:100%}
.cmp.on{border-color:var(--vine);background:var(--on-accent)}
.cmp .t{display:block;font-size:13px;font-weight:600}
.cmp .d{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cmp .c{display:block;font-family:var(--mono);font-size:15px;font-weight:600;text-align:right}
.cmp .e{display:block;font-family:var(--mono);font-size:12px;margin-top:2px;text-align:right}
.up{color:var(--warn)}.down{color:var(--vine)}.ref{color:var(--muted)}

/* ---- débit de chantier ---- */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--field);border:1px solid var(--field);border-radius:8px;overflow:hidden}
.res>div{background:var(--surface);padding:14px 16px}
.res .v{font-family:var(--mono);font-size:18px;font-weight:600}
.res .l{font-size:12px;color:var(--muted);margin-top:5px}
.sens{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.sens li{display:grid;grid-template-columns:4.5em minmax(0,1fr) 5.6em;gap:12px;align-items:center;font-size:13px}
.sens .v{font-family:var(--mono);color:var(--muted)}
.sens li.cur .v{color:var(--ink);font-weight:600}
.sens .bar{height:10px}
.sens .bar span{background:var(--dim)}
.sens li.cur .bar span{background:var(--slate)}
.sens b{text-align:right;font-family:var(--mono);font-weight:600}

/* ---- contrôles et tests ---- */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.ctl .n{font-family:var(--mono);font-size:16px;font-weight:600}
.ctl .l{font-size:13.5px}
.ctl .s{font-size:12px;color:var(--muted);margin-top:3px}
.tst{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.tst .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tst .l{font-size:13px}
.tst .o{font-size:11.5px;color:var(--muted);margin-top:3px}
.tst .vd{font-family:var(--mono);font-size:12px;font-weight:600}
.score{font-family:var(--mono);font-size:13px;font-weight:600}

.empty{padding:28px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}

<script id="moteur">
/* ===== CORE (pur, sans DOM) ===== */
const Core = (() => {
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  const pmt = (r, n, pv) => { if (!n) return 0; return r ? pv * r / (1 - Math.pow(1 + r, -n)) : pv / n; };
  function rateMO(ref, code) {
    const m = ref.mo.find(x => x.code === code);
    if (!m) return { rate: 0, err: `Code main-d'œuvre inconnu : ${code}` };
    if (num(m.brut) === null) return { rate: 0, err: `Taux horaire absent pour ${code}` };
    return { rate: m.brut * (1 + (num(m.charges) || 0)) };
  }
  const machFixe = (m, taux) => pmt(taux, num(m.duree) || 0, num(m.valeur) || 0) + (num(m.entretien) || 0) + (num(m.autres) || 0) + (num(m.assurance) || 0);
  function rateMach(ref, code, heures) {
    const m = ref.machines.find(x => x.code === code);
    if (!m) return { rate: 0, err: `Code machine inconnu : ${code}` };
    if (!heures) return { rate: 0, err: `${m.libelle} : 0 h d'utilisation, coût horaire non calculable` };
    return { rate: machFixe(m, ref.params.taux) / heures + (num(m.conso) || 0) * (num(ref.params.gnr) || 0), heures, fixe: machFixe(m, ref.params.taux) };
  }
  function intrantPrix(ref, id) {
    const i = ref.intrants.find(x => x.id === id);
    if (!i) return { prix: 0, err: `Intrant introuvable : ${id}` };
    if (num(i.prix) === null) return { prix: 0, err: `Prix manquant : ${i.composition || i.code}` };
    return { prix: i.prix, i };
  }
  const kgRecoltes = (ref, opts) => (num(ref.params.volume) || 0) + (num(opts.miseReserve) || 0);
  // heures MO et traction d'une opération (par ha et par passage)
  function heuresOp(ref, op, opts) {
    let h = num(op.hMO) || 0;
    if (op.role === 'cueillette' && opts.vendange === 'productivite') h = kgRecoltes(ref, opts) / opts.kgh * opts.coefOrga;
    return { h, hMach: op.codeMach ? h : 0 };
  }
  // coût d'une opération par ha et par passage, taux machine fourni
  function coutOp(ref, op, opts, machRate) {
    const w = [];
    const { h, hMach } = heuresOp(ref, op, opts);
    let mo = 0;
    if (op.role === 'cueillette' && opts.vendange === 'tache') {
      const kg = kgRecoltes(ref, opts);
      mo = kg * (opts.prixKg + opts.primeTri) * (1 + opts.finContrat) * (1 + opts.cp) * (1 + opts.chargesResid) + kg * opts.fraisAnnexesKg;
    } else if (op.codeMO && h) { const r = rateMO(ref, op.codeMO); if (r.err) w.push(r.err); mo = h * r.rate; }
    let mach = 0;
    if (op.codeMach && hMach) { const r = machRate(op.codeMach); if (r.err) w.push(r.err); mach = hMach * r.rate; }
    let intr = 0;
    if (op.intrant) { const r = intrantPrix(ref, op.intrant); if (r.err) w.push(r.err); intr = (num(op.qIntrant) || 0) * r.prix; }
    const presta = num(op.presta) || 0;
    return { h, hMach, mo, mach, intr, presta, total: mo + mach + intr + presta, warnings: w };
  }
  const surfMoy = (ref, id) => { const p = ref.profils.find(x => x.id === id); return p && p.nb ? p.surf / p.nb : null; };
  function scenario(ref, opts, id) {
    const surf = surfMoy(ref, id) || 1;
    const raw = (ref.scenarios[id] || []).map((l, idx) => ({ idx, code: l.code, nb: num(l.nb) || 0, op: ref.operations.find(o => o.code === l.code) }));
    const heuresMach = {};
    raw.forEach(l => { if (l.op && l.op.codeMach) { const { hMach } = heuresOp(ref, l.op, opts); heuresMach[l.op.codeMach] = (heuresMach[l.op.codeMach] || 0) + hMach * l.nb * surf; } });
    const cache = {};
    const machRate = code => cache[code] || (cache[code] = rateMach(ref, code, opts.machine === 'scenario' ? heuresMach[code] : (ref.machines.find(m => m.code === code) || {}).heures));
    const warnings = new Set();
    const lines = raw.map(l => {
      if (!l.op) { warnings.add(`Code inconnu dans le scénario : ${l.code}`); return { ...l, unknown: true, mo: 0, mach: 0, intr: 0, presta: 0, total: 0, h: 0, hMach: 0 }; }
      const c = coutOp(ref, l.op, opts, machRate);
      c.warnings.forEach(x => warnings.add(x));
      const k = l.nb;
      if (c.total * k === 0) warnings.add(`${l.op.libelle} (${l.code}) : coût nul`);
      return { ...l, mo: c.mo * k, mach: c.mach * k, intr: c.intr * k, presta: c.presta * k, total: c.total * k, h: c.h * k, hMach: c.hMach * k };
    });
    const sum = f => lines.reduce((a, l) => a + l[f], 0);
    const volume = num(ref.params.volume) || 0, prix = num(ref.params[opts.prix]) || 0;
    const cout = sum('total');
    const familles = {};
    lines.forEach(l => { const f = l.op ? l.op.famille : 'Inconnu'; familles[f] = (familles[f] || 0) + l.total; });
    if (ref.operations.some(o => o.intrant && (ref.intrants.find(i => i.id === o.intrant) || {}).composition === 'Glyphosate') && lines.some(l => l.op && l.op.intrant && (ref.intrants.find(i => i.id === l.op.intrant) || {}).composition === 'Glyphosate'))
      warnings.add('Glyphosate : vérifier la dose en substance active, ≤ 450 g/ha/an et uniquement sous le rang en parcelle mécanisable (Anses, conditions d\'emploi depuis 2020-2021).');
    return { id, surf, lines, heuresMach, machRates: cache, warnings: [...warnings],
      synth: { cout, mo: sum('mo'), mach: sum('mach'), intr: sum('intr'), presta: sum('presta'), hMO: sum('h'), hMach: sum('hMach'),
        volume, prix, produit: volume * prix, marge: volume * prix - cout, eurKg: volume ? cout / volume : null, coutExploit: cout * surf, familles } };
  }
  function debit(d) {
    const rangs = Math.round(d.largeur / d.ecRang), surf = d.longueur * d.largeur / 10000;
    const pieds = Math.round(rangs * (d.longueur / d.ecPied));
    const tMan = pieds / d.piedsH;
    const passages = Math.ceil(rangs / d.rangsPassage);
    const travail = (v) => (d.longueur * passages) / (v * 1000) + passages * d.demiTour / 3600;
    const tMach = v => travail(v) * (1 + d.arret + d.route);
    return { rangs, surf, pieds, densite: surf ? pieds / surf : 0, tMan, hHaMan: surf ? tMan / surf : 0, passages,
      partDemiTour: (passages * d.demiTour / 3600) / travail(d.vitesse), hHaMach: surf ? tMach(d.vitesse) / surf : 0,
      sensib: [2, 3, 4, 5, 6, 7, 8].map(v => ({ v, hHa: surf ? tMach(v) / surf : 0 })) };
  }
  function controles(ref) {
    const c = [];
    const cnt = (arr) => arr.length;
    const dup = arr => { const s = {}; arr.forEach(x => s[x] = (s[x] || 0) + 1); return arr.filter(x => s[x] > 1); };
    const baseOpts = { machine: 'bareme', vendange: 'fixe' };
    const mr = code => rateMach(ref, code, (ref.machines.find(m => m.code === code) || {}).heures);
    const zero = ref.operations.filter(o => coutOp(ref, o, baseOpts, mr).total === 0);
    c.push({ label: 'Opérations dont le coût est nul', n: cnt(zero), attendu: 'À vérifier : prestations ou opérations non chiffrées', detail: zero.map(o => o.code) });
    const orph = ref.operations.filter(o => o.intrant && !ref.intrants.find(i => i.id === o.intrant));
    c.push({ label: 'Intrants référencés mais absents du barème', n: cnt(orph), attendu: '0', detail: orph.map(o => o.code) });
    const moVide = ref.mo.filter(m => num(m.brut) === null);
    c.push({ label: "Codes main-d'œuvre sans taux horaire", n: cnt(moVide), attendu: 'Prestations au kg : normal si non utilisées', detail: moVide.map(m => m.code) });
    const prixVides = ref.intrants.filter(i => num(i.prix) === null);
    c.push({ label: 'Intrants sans prix', n: cnt(prixVides), attendu: 'À saisir avant usage économique', detail: [] });
    const sansScen = ref.profils.filter(p => !(ref.scenarios[p.id] || []).length);
    c.push({ label: 'Profils sans scénario défini', n: cnt(sansScen), attendu: 'Coût affiché à 0 € pour ces profils', detail: sansScen.map(p => p.id) });
    const inconnus = []; Object.entries(ref.scenarios).forEach(([k, ls]) => ls.forEach(l => { if (!ref.operations.find(o => o.code === l.code)) inconnus.push(`${k}:${l.code}`); }));
    c.push({ label: 'Lignes de scénario avec un code inconnu', n: cnt(inconnus), attendu: '0', detail: inconnus });
    const dOp = [...new Set(dup(ref.operations.map(o => o.code || '')))];
    c.push({ label: 'Codes opération en doublon ou vides', n: cnt(dOp), attendu: '0', detail: dOp });
    const dIn = [...new Set(dup(ref.intrants.map(i => i.code)))];
    c.push({ label: 'Codes intrants en doublon', n: cnt(dIn), attendu: 'Sans effet ici (clé interne unique), à nettoyer', detail: dIn });
    return c;
  }
  return { pmt, rateMO, rateMach, machFixe, coutOp, heuresOp, scenario, debit, controles, surfMoy, kgRecoltes };
})();

/* ===== CAS DE VALIDATION — source unique, partagée par le navigateur et `npm test` =====
 * Chaque cas fige une valeur du classeur Excel v2 (19/09/2026) ou un calcul de référence sourcé.
 * Modifier une valeur attendue exige une entrée dans docs/decisions.md qui dit POURQUOI.
 * Toujours exécutés sur le référentiel d'usine (data/referentiel.json), jamais sur les saisies. */
const CasValidation = (() => {
  const DEFAULT_OPTS = { machine: 'bareme', vendange: 'fixe', kgh: 35, coefOrga: 1.35, prixKg: 0.214, primeTri: 0, finContrat: 0.10, cp: 0.10, chargesResid: 0, fraisAnnexesKg: 0, miseReserve: 0, prix: 'prix1' };
  const DEFAULT_DEBIT = { longueur: 24, largeur: 7, ecRang: 1.1, ecPied: 1.1, piedsH: 400, vitesse: 4, rangsPassage: 2, demiTour: 45, arret: 0.1, route: 0.1 };
  const CAS = [
    { id: 'T1', libelle: 'SC_2 : coût technique = 20 609,59 €/ha', origine: 'Excel v2 SCENARIOS!K3', calc: r => r.base.synth.cout, attendu: 20609.59, tol: 0.01 },
    { id: 'T2', libelle: "SC_2 : main-d'œuvre = 701,5 h/ha (sans double comptage)", origine: 'Excel v2 SCENARIOS!K4', calc: r => r.base.synth.hMO, attendu: 701.5, tol: 1e-6 },
    { id: 'T3', libelle: 'SC_2 : traction = 58,5 h/ha', origine: 'Excel v2 SCENARIOS!K10', calc: r => r.base.synth.hMach, attendu: 58.5, tol: 1e-6 },
    { id: 'T4', libelle: 'Enjambeur au barème = 72,564 €/h', origine: 'Excel v2 BAREMES_MECANIQUE!M3', calc: r => r.base.machRates.ENG_ENJ.rate, attendu: 72.564, tol: 0.001 },
    { id: 'T5', libelle: 'Heures du scénario : enjambeur 151,19 h/an', origine: 'Calcul audit 19/09/2026 (58,5 h/ha × 2,584 ha)', calc: r => r.scen.heuresMach.ENG_ENJ, attendu: 151.19, tol: 0.01 },
    { id: 'T6', libelle: 'Heures du scénario : enjambeur 248,79 €/h', origine: 'Calcul audit 19/09/2026', calc: r => r.scen.machRates.ENG_ENJ.rate, attendu: 248.79, tol: 0.01 },
    { id: 'T7', libelle: 'Cueillette à la tâche, 8 800 kg : 0,214 × 1,1 × 1,1 × 8 800 = 2 278,67 €/ha', origine: 'Barème SGV vendanges 2025', calc: r => r.tache.lines.find(l => l.code === 'VEN_1_NA_MIX').mo, attendu: 2278.672, tol: 0.001 },
    { id: 'T8', libelle: 'SC_2 : 2,342 €/kg à 8 800 kg', origine: 'T1 / rendement 2026', calc: r => r.base.synth.eurKg, attendu: 20609.5946 / 8800, tol: 1e-6 },
    { id: 'T9', libelle: 'Débit 4 km/h, parcelle 24 × 7 m : 3,964 h/ha', origine: 'Excel v2 DEBIT_CHANTIER!B31', calc: r => r.debit.hHaMach, attendu: 3.9642857, tol: 1e-6 },
  ];
  function executer(Core, ref) {
    const r = { base: Core.scenario(ref, DEFAULT_OPTS, 'SC_2'), scen: Core.scenario(ref, { ...DEFAULT_OPTS, machine: 'scenario' }, 'SC_2'),
      tache: Core.scenario(ref, { ...DEFAULT_OPTS, vendange: 'tache' }, 'SC_2'), debit: Core.debit(DEFAULT_DEBIT) };
    return CAS.map(c => { let v; try { v = c.calc(r); } catch (e) { v = NaN; } return { id: c.id, l: c.libelle, origine: c.origine, v, exp: c.attendu, ok: Math.abs(v - c.attendu) <= c.tol }; });
  }
  return { DEFAULT_OPTS, DEFAULT_DEBIT, CAS, executer };
})();
</script>
<!-- ================= SECTION INTERFACE ================= -->
<script id="interface">
/* ===== UI — rendu et orchestration. Aucune formule métier ici : tout calcul passe par Core. ===== */
if (typeof REFERENTIEL === 'undefined') { document.body.innerHTML = '<p style="padding:2rem">Données introuvables : ouvrez index.html depuis le dossier du projet (data/referentiel.js doit être à côté).</p>'; throw new Error('data/referentiel.js non chargé'); }
const FACTORY = JSON.parse(JSON.stringify(REFERENTIEL)); // défini par data/referentiel.js (portée globale partagée entre scripts)
const KEY = 'oad-couts-techniques-champagne';
const DEFAULT_OPTS = CasValidation.DEFAULT_OPTS;
const DEFAULT_DEBIT = CasValidation.DEFAULT_DEBIT;
const clone = o => JSON.parse(JSON.stringify(o));
/* Filtres et bascules d'affichage : jamais persistés (voir save()). */
const VOLATILE = { filtre: '', filtreIntr: '', famille: '', sansSource: false, sansPrix: false, sources: false, intrTout: false };
let S = { ref: clone(FACTORY), opts: { ...DEFAULT_OPTS }, debit: { ...DEFAULT_DEBIT }, scen: 'SC_2', tab: 'scenario', ...VOLATILE };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.ref && s.ref.operations) S = { ...S, ...s, opts: { ...DEFAULT_OPTS, ...s.opts }, debit: { ...DEFAULT_DEBIT, ...s.debit }, ...VOLATILE }; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ref: S.ref, opts: S.opts, debit: S.debit, scen: S.scen, tab: S.tab })); } catch (e) {} };

/* ---------- format et fabriques de champs ---------- */
const fr = (v, d = 0) => (v === null || v === undefined || !isFinite(v)) ? '–' : v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (v, d = 0) => fr(v, d) + ' €';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const parseNum = v => { if (v === '' || v === null) return null; const n = Number(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const part = (v, t) => (t ? fr(100 * v / t, 0) : '0') + ' %';
const signe = d => (d > 0 ? '+' : '−') + eur(Math.abs(d));
const sens = d => d > 0 ? 'up' : (d < 0 ? 'down' : 'ref');
/* Couleur de famille : 9 jetons --fam-1…--fam-9, affectation stable par hachage du nom. */
const famTok = nom => { let h = 0; const n = String(nom || ''); for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 9973; return 'var(--fam-' + (h % 9 + 1) + ')'; };
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };

function numIn(path, v, w = '') { return `<input class="n ${w}" inputmode="decimal" data-path="${path}" value="${v === null || v === undefined ? '' : String(v).replace('.', ',')}">`; }
function txtIn(path, v, w = '') { return `<input class="t ${w}" data-path="${path}" value="${esc(v)}">`; }
function sel(path, v, options, blank, cls) { return `<select class="${cls || ''}" data-path="${path}">${blank ? `<option value="">${esc(blank)}</option>` : ''}${options.map(([k, l]) => `<option value="${esc(k)}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`; }

/* Les trois variantes de méthode, calculées sur le même scénario (arbitrages A1 et A2 ouverts). */
function variantes() {
  const o = S.opts;
  return {
    base: Core.scenario(S.ref, { ...o, machine: 'bareme', vendange: 'fixe' }, S.scen),
    mach: Core.scenario(S.ref, { ...o, machine: 'scenario', vendange: 'fixe' }, S.scen),
    tache: Core.scenario(S.ref, { ...o, machine: 'bareme', vendange: 'tache' }, S.scen),
    prod: Core.scenario(S.ref, { ...o, machine: 'bareme', vendange: 'productivite' }, S.scen)
  };
}
const ligneCueillette = r => r.lines.find(l => l.op && l.op.role === 'cueillette');

/* ---------- en-tête ---------- */
const L_MACH = { bareme: 'heures du barème', scenario: 'heures du scénario' };
const L_VEND = { fixe: 'temps fixe', productivite: 'productivité kg/h', tache: 'tâche €/kg' };
function renderHead(res, V) {
  const P = S.ref.profils, p = P.find(x => x.id === S.scen) || {};
  $('#prof').innerHTML = P.map(x => `<option value="${esc(x.id)}"${x.id === S.scen ? ' selected' : ''}>${esc(x.id)} · ${esc(x.classe)} ha · ${esc(x.dep)} · ${esc(x.cert)}${(S.ref.scenarios[x.id] || []).length ? '' : ' (vide)'}</option>`).join('');
  const nOk = P.filter(x => (S.ref.scenarios[x.id] || []).length).length;
  $('#nprof').textContent = `${fr(nOk)} profil${nOk > 1 ? 's' : ''} sur ${fr(P.length)} renseigné${nOk > 1 ? 's' : ''}`;
  $('#faits').innerHTML = `<span>Surface moyenne <b>${fr(res.surf, 2)} ha</b></span><span>Exploitations <b>${fr(p.nb)}</b></span><span>Certification <b class="t">${esc(p.cert || '–')}</b></span>`;
  const s = res.synth, vide = !res.lines.length, d = s.cout - V.base.synth.cout;
  $('#kpis').innerHTML = `
   <div class="kpi main"><div><span class="v">${eur(vide ? 0 : s.cout)}</span><span class="u">/ ha</span></div><span class="l">Coût technique opérationnel</span>${Math.abs(d) > 1 ? `<div class="badge"><b>${signe(d)}</b><span>vs méthode du classeur</span></div>` : ''}</div>
   <div class="kpi"><span class="v">${vide ? '–' : fr(s.eurKg, 2)}</span><span class="l">€ / kg commercialisable</span></div>
   <div class="kpi"><span class="v">${vide ? '–' : fr(s.hMO, 0)}</span><span class="l">h main-d'œuvre / ha</span></div>
   <div class="kpi"><span class="v">${vide ? '–' : fr(s.hMach, 1)}</span><span class="l">h traction / ha</span></div>
   <div class="kpi marge"><span class="v">${vide ? '–' : eur(s.marge)}</span><span class="l">marge sur coûts opér. / ha</span></div>`;
  $('#meth').innerHTML = `<span class="t">Méthode active</span>
   <div class="chips">
    <button class="chip" data-act="chip" data-k="machine" title="Basculer le mode de calcul du coût horaire du matériel"><span class="g">Matériel</span><b>${L_MACH[S.opts.machine]}</b></button>
    <button class="chip" data-act="chip" data-k="vendange" title="Basculer la méthode de cueillette"><span class="g">Vendange</span><b>${L_VEND[S.opts.vendange]}</b></button>
   </div>
   <span class="ctx">${fr(s.volume)} kg/ha à ${fr(s.prix, 2)} €/kg · surface moyenne ${fr(res.surf, 2)} ha</span>`;
}

/* ---------- alertes typées (règle d'affichage : le moteur ne connaît pas les niveaux) ---------- */
function alertes(res) {
  const A = [], w = res.warnings;
  w.filter(x => /Glyphosate/.test(x)).forEach(x => A.push(['reg', 'réglementaire', x, "Anses, conditions d'emploi depuis 2020-2021"]));
  const sp = S.ref.intrants.filter(i => i.prix === null).length;
  if (sp) A.push(['don', 'donnée', `${fr(sp)} intrants sur ${fr(S.ref.intrants.length)} n'ont pas de prix : les opérations concernées sortent sous-évaluées.`, 'Onglet Barèmes → Intrants']);
  w.filter(x => !/Glyphosate/.test(x) && /coût nul|Prix manquant|Taux horaire absent|inconnu|introuvable/.test(x))
   .forEach(x => A.push(['don', 'donnée', x, 'Valeur à compléter dans le référentiel']));
  w.filter(x => /0 h d'utilisation/.test(x)).forEach(x => A.push(['met', 'méthode', x, 'Arbitrage A1 · coût horaire du matériel']));
  const pr = res.lines.filter(l => l.op && l.presta > 0 && !l.mo && !l.intr).sort((a, b) => b.presta - a.presta)[0];
  if (pr) A.push(['met', 'méthode', `${pr.op.famille} comptée en prestation (${fr(pr.nb)} passages × ${eur(pr.presta / (pr.nb || 1))}), sans le coût des produits.`, 'Arbitrage A2 · données Comité Champagne à obtenir']);
  A.push(['per', 'périmètre', "Coût technique hors charges de structure, fermage, amortissement des plantations et rémunération de l'exploitant.", 'Le résultat se lit comme une marge sur coûts opérationnels']);
  return A;
}

/* ---------- onglet scénario ---------- */
function renderScenario(res, V) {

  const comp = [["Main-d'œuvre", 'MO', s.mo, 'c-mo'], ['Traction et matériel', 'Matériel', s.mach, 'c-ma'], ['Intrants', 'Intrants', s.intr, 'c-in'], ['Prestations', 'Presta', s.presta, 'c-pr']];
  const fam = Object.entries(s.familles).sort((x, y) => y[1] - x[1]);

    <ul class="legend">${comp.map(c => `<li><i class="${c[3]}"></i>${esc(c[0])}<b>${eur(c[2])}</b><em>${part(c[2], s.cout)}</em></li>`).join('')}</ul>
    <h2 class="mt2">Par famille d'opérations</h2>
    <p class="note">${fr(fam.length)} familles · les trois premières pèsent ${part(tete3, s.cout)} du coût</p>
    <ol class="fam">${fam.map(([f, v]) => `<li><span title="${esc(f)}">${esc(f)}</span><span class="bar"><span style="width:${100 * v / maxF}%;background:${famTok(f)}"></span></span><b>${eur(v)}</b><em>${part(v, s.cout)}</em></li>`).join('') || '<li><span class="mut">Aucune opération</span></li>'}</ol>
   </div>
   <div class="col">
    <div class="card p0">
     <div class="alert-h"><span class="n">${fr(al.length)}</span><h2>Points à vérifier</h2></div>
     <ul class="alerts">${al.map(a => `<li><span class="lvl ${a[0]}">${esc(a[1])}</span><div><div class="tx">${esc(a[2])}</div><div class="or">${esc(a[3])}</div></div></li>`).join('')}</ul>
    </div>
    <div class="card">
     <div class="hd"><h2>Matériel mobilisé</h2><span class="m">arbitrage A1</span></div>
     <p class="note">Heures annuelles du barème comparées aux heures réellement mobilisées par le scénario, sur ${fr(res.surf, 2)} ha.</p>
     <table class="mini"><thead><tr><th>Machine</th><th class="r">h/an barème</th><th class="r">h/an scénario</th><th class="r">€/h retenu</th></tr></thead><tbody>
     ${Object.keys(res.heuresMach).map(k => { const m = S.ref.machines.find(x => x.code === k) || {}; const r = res.machRates[k] || {}; return `<tr><td>${esc(m.libelle || k)}</td><td class="r">${fr(m.heures)}</td><td class="r">${fr(res.heuresMach[k], 0)}</td><td class="r b">${r.err ? '–' : fr(r.rate, 2) + ' €'}</td></tr>`; }).join('') || '<tr><td colspan="4" class="mut">Aucune machine mobilisée par ce scénario.</td></tr>'}

    </div>

     <p class="note">Les trois variantes ouvertes, sur le même scénario. Cliquer une ligne l'applique à toute la page.</p>
     <div class="cmps">${cmp.map(c => { const d = c[3] - cb; return `<button class="cmp${c[4] ? ' on' : ''}" data-act="cmp" data-v="${c[0]}"><span><span class="t">${esc(c[1])}</span><span class="d">${esc(c[2])}</span></span><span><span class="c">${eur(c[3])}</span><span class="e ${sens(d)}">${d === 0 ? 'référence' : signe(d)}</span></span></button>`; }).join('')}</div>
    </div>

  </div>
  <div class="card p0 mt">
   <div class="card-h">

     <button data-act="print" class="pri">Imprimer la fiche</button>
    </div>
   </div>
   ${empty ? `<div style="padding:20px"><p class="empty">Ce profil n'a pas encore d'opérations. Partez du scénario SC_2 ou ajoutez les opérations une à une.</p><div class="acts" style="margin-top:12px;justify-content:center"><button data-act="copyScen" class="pri">Partir du scénario SC_2</button></div></div>` : `

     return `<tr class="${l.unknown || !l.total ? 'flag' : ''}">
    <td><div class="opc"><span class="f" style="background:${tok}"></span><span>${sel(`scen.${l.idx}.code`, l.code, opts, '', 'sl op-sel')}<span class="meta">${esc(l.code)}${o ? ' · ' + esc(o.mode) + '/' + esc(o.org) : ''}</span></span></div>${S.sources ? `<div class="srcl${src ? '' : ' no'}">${src ? 'Source : ' + esc(src) : 'Aucune source renseignée'}</div>` : ''}</td>
    <td class="r">${numIn(`scen.${l.idx}.nb`, l.nb, 'xs')}</td>
    <td class="r b">${eur(l.total)}</td>
    <td class="r${l.mo ? '' : ' z'}">${eur(l.mo)}</td>
    <td class="r${l.mach ? '' : ' z'}">${eur(l.mach)}</td>
    <td class="r${l.intr ? '' : ' z'}">${eur(l.intr)}</td>
    <td class="r${l.presta ? '' : ' z'}">${eur(l.presta)}</td>

    <td class="r"><button class="x" data-act="delLine" data-i="${l.idx}" aria-label="Retirer la ligne">Retirer</button></td></tr>`; }).join('')}
   </tbody><tfoot><tr><td>Total scénario</td><td></td><td class="r b">${eur(s.cout)}</td><td class="r">${eur(s.mo)}</td><td class="r">${eur(s.mach)}</td><td class="r">${eur(s.intr)}</td><td class="r">${eur(s.presta)}</td><td class="r">${fr(s.hMO, 1)}</td><td class="r">${fr(s.hMach, 1)}</td><td></td></tr></tfoot></table></div>
   <div class="card-f"><span>Coût à l'échelle de l'exploitation <b>${eur(s.coutExploit)}</b></span><span>Produit <b>${eur(s.produit)}</b></span><span>Le temps de main-d'œuvre inclut le tractoriste : ne pas l'additionner au temps de traction.</span></div>`}
  </div>`;
}

/* ---------- onglet opérations ---------- */
function renderOperations() {
  const mr = code => Core.rateMach(S.ref, code, (S.ref.machines.find(m => m.code === code) || {}).heures);
  const used = new Set(Object.values(S.ref.scenarios).flat().map(l => l.code));
  const moO = S.ref.mo.map(m => [m.code, m.code]), maO = S.ref.machines.map(m => [m.code, m.code]);
  const inO = S.ref.intrants.map(i => [i.id, `${i.composition || i.noms || i.code}${i.prix === null ? ' (prix ?)' : ''}`]);
  const f = S.filtre.toLowerCase();
  const all = S.ref.operations.map((o, i) => ({ o, i }));
  const rows = all.filter(({ o }) => (!f || (o.code + o.libelle + o.famille).toLowerCase().includes(f)) && (!S.famille || o.famille === S.famille) && (!S.sansSource || !o.source));
  const cnt = {}; all.forEach(({ o }) => cnt[o.famille] = (cnt[o.famille] || 0) + 1);
  const fac = [['', 'Toutes', all.length]].concat(Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([n, c]) => [n, n, c]));

   <td>${txtIn(`op.${i}.libelle`, o.libelle, 'sl w14')}</td>
   <td class="nw">${sel(`op.${i}.mode`, o.mode, [['VE', 'VE'], ['VSL', 'VSL'], ['NA', 'NA']], '', 'sl')} / ${sel(`op.${i}.org`, o.org, [['Exploitation', 'Exploitation'], ['Prestataire', 'Prestataire'], ['Mixte', 'Mixte']], '', 'sl')}</td>
   <td>${sel(`op.${i}.codeMO`, o.codeMO || '', moO, '–', 'sl')}</td>
   <td class="r">${numIn(`op.${i}.hMO`, o.hMO, 'xs')}</td>
   <td>${sel(`op.${i}.codeMach`, o.codeMach || '', maO, '–', 'sl')}</td>
   <td><span class="cut">${sel(`op.${i}.intrant`, o.intrant || '', inO, '–', 'sl')}</span></td>

 </div>`;
}

/* ---------- onglet paramètres et méthodes ---------- */
function renderParams(V) {

  const libMach = topMach ? (S.ref.machines.find(m => m.code === topMach[0]) || {}).libelle || topMach[0] : '';
  const cueil = r => { const l = ligneCueillette(r); return l ? eur(l.total) : '–'; };
  const cueilMO = r => { const l = ligneCueillette(r); return l ? eur(l.mo) : '–'; };
  const rows = [
    ['p.volume', 'Rendement commercialisable', P.volume, 'kg/ha', 'Comité Champagne, communiqué vendange 2026 (22/07/2026)'],
    ['p.butoir', 'Rendement butoir', P.butoir, 'kg/ha', 'CIVC-REND-2026'],

   <h2>Paramètres de campagne</h2>
   <div class="rows">${rows.map(r => `<div class="row"><div><div class="l">${esc(r[1])}</div><div class="s">${esc(r[4])}</div></div><div class="v">${numIn(r[0], r[2])}<span class="u">${esc(r[3])}</span></div></div>`).join('')}
    <div class="row"><div><div class="l">Prix retenu pour le produit et la marge</div><div class="s">Bascule entre les deux prix ci-dessus.</div></div><div class="v">${sel('opts.prix', O.prix, [['prix1', 'Scénario 1'], ['prix2', 'Scénario 2']])}<span class="u"></span></div></div>
   </div>
  </div>
  <div class="col">
   <div class="card">
    <h2>Méthodes de calcul</h2>
    <p class="note">La valeur par défaut reproduit le classeur Excel v2. Les variantes restent visibles pour arbitrage et changent la page entière.</p>
    <div class="meths">${meths.map(m => `<button class="mth${O[m[0]] === m[1] ? ' on' : ''}" data-act="opt" data-k="${m[0]}" data-v="${m[1]}"><span class="dot"></span><span><span class="t">${esc(m[2])}</span><span class="d">${esc(m[3])}</span><span class="k">${esc(m[4])}</span></span></button>`).join('')}</div>
    <p class="note mt">Référentiel ${esc(S.ref.version)} · ${esc(S.ref.source)}</p>
   </div>
   <div class="card">
    <h2>Paramètres de la cueillette</h2>
    <p class="note">Utilisés par les variantes « productivité » et « tâche ». Barème SGV vendanges 2025 : 0,214 €/kg brut (7 000 à 10 000 kg/ha, vignes non effeuillées, avec débardage), plus 10 % d'indemnité de fin de contrat et 10 % de congés payés, vendangeur non nourri non logé. Charges résiduelles sous TO-DE et frais annexes : à confirmer (MSA, SGV).</p>
    <div class="rows">
     ${[['opts.kgh', 'Productivité', O.kgh, 'kg/h'], ['opts.coefOrga', "Coefficient d'organisation", O.coefOrga, ''], ['opts.prixKg', 'Prix du kilo brut', O.prixKg, '€/kg'], ['opts.primeTri', 'Prime qualitative de tri', O.primeTri, '€/kg'], ['opts.finContrat', 'Indemnité fin de contrat', O.finContrat, 'part'], ['opts.cp', 'Indemnité congés payés', O.cp, 'part'], ['opts.chargesResid', 'Charges patronales résiduelles', O.chargesResid, 'part'], ['opts.fraisAnnexesKg', 'Logement, repas, transport', O.fraisAnnexesKg, '€/kg']]
       .map(r => `<div class="row fld"><div class="l">${esc(r[1])}</div><div class="v">${numIn(r[0], r[2])}<span class="u">${esc(r[3])}</span></div></div>`).join('')}
    </div>
   </div>
   <div class="card">
    <h2>Référentiel</h2>
    <p class="note">Les modifications sont enregistrées dans ce navigateur, jamais envoyées ailleurs.</p>
    <div class="acts"><button data-act="json" class="dl">Exporter le référentiel (JSON)</button><label class="btn">Importer un référentiel<input type="file" accept=".json,application/json" data-act="import" hidden></label><button data-act="reset" class="danger">Revenir aux valeurs d'origine</button></div>
   </div>
  </div>
 </div>`;
}

/* ---------- onglet débit de chantier ---------- */
function renderDebit() {
  const d = S.debit, r = Core.debit(d);
  const max = Math.max(...r.sensib.map(x => x.hHa), 0.001);
  const champs = [['longueur', 'Longueur des rangs', 'm'], ['largeur', 'Largeur de la parcelle', 'm'], ['ecRang', 'Écartement entre rangs', 'm'], ['ecPied', 'Écartement entre pieds', 'm'],
    ['piedsH', 'Rendement manuel', 'pieds/h'], ['vitesse', "Vitesse d'avancement", 'km/h'], ['rangsPassage', 'Rangs par passage', ''], ['demiTour', 'Demi-tour par passage', 's'],
    ['arret', "Temps d'arrêt", 'part'], ['route', 'Temps de route', 'part']];
  const res = [[fr(r.surf, 4) + ' ha', 'surface de la parcelle', ''], [fr(r.densite) + ' /ha', `${fr(r.rangs)} rangs · ${fr(r.pieds)} pieds`, ''],
    [fr(r.hHaMan, 1) + ' h/ha', 'chantier manuel', 'ok'], [fr(r.hHaMach, 2) + ' h/ha', `chantier mécanisé · ${fr(r.passages)} passages`, 'acc'],
    [fr(100 * r.partDemiTour, 0) + ' %', 'part des demi-tours', 'ko']];
  return `<div class="g-debit">
  <div class="card">
   <h2>Parcelle et chantier</h2>
   <p class="note">Géométrie de la parcelle et conduite du chantier. Saisie en virgule décimale.</p>
   <div class="rows">${champs.map(c => `<label class="row fld"><span class="l">${esc(c[1])}</span><span class="v">${numIn('debit.' + c[0], d[c[0]])}<span class="u">${esc(c[2])}</span></span></label>`).join('')}</div>
  </div>
  <div class="col">
   <div class="card">
    <h2>Résultats ramenés à l'hectare</h2>
    <div class="res mt">${res.map(x => `<div><div class="v ${x[2]}">${x[0]}</div><div class="l">${esc(x[1])}</div></div>`).join('')}</div>
    <p class="note" style="margin:16px 0 0">Sur rangs courts, le temps de demi-tour domine : ici ${fr(100 * r.partDemiTour, 0)} % du temps de travail, donc augmenter la vitesse gagne peu. Ce simulateur n'est pas encore relié aux h/ha des opérations (arbitrage A6).</p>
   </div>
   <div class="card">
    <div class="hd"><h2>Sensibilité à la vitesse</h2><span class="m">h / ha, chantier mécanisé</span></div>
    <ol class="sens">${r.sensib.map(x => `<li class="${x.v === Number(d.vitesse) ? 'cur' : ''}"><span class="v">${fr(x.v)} km/h</span><span class="bar"><span style="width:${100 * x.hHa / max}%"></span></span><b>${fr(x.hHa, 2)}</b></li>`).join('')}</ol>
   </div>
  </div>
 </div>`;
}

/* ---------- onglet contrôles et tests ---------- */
const runTests = () => CasValidation.executer(Core, clone(FACTORY));
function renderControles() {
  const c = Core.controles(S.ref), t = runTests(), okN = t.filter(x => x.ok).length;
  const sev = x => x.attendu === '0' ? (x.n ? 'ko' : 'ok') : (x.n ? 'mid-c' : 'ok');
  return `<div class="g2">
  <div class="card">
   <h2>Cohérence du référentiel</h2>
   <p class="note">Calculée sur le référentiel en cours, saisies comprises.</p>
   <div class="rows">${c.map(x => `<div class="ctl"><div><div class="l">${esc(x.label)}</div><div class="s">${esc(x.attendu)}${x.detail.length && x.detail.length <= 15 ? ' · ' + esc(x.detail.join(', ')) : ''}</div></div><span class="n ${sev(x)}">${fr(x.n)}</span></div>`).join('')}</div>
  </div>
  <div class="card">
   <div class="hd"><h2>Cas de validation <span class="score ${okN === t.length ? 'ok' : 'ko'}">${fr(okN)} / ${fr(t.length)}</span></h2></div>
   <p class="note">Exécutés sur les valeurs d'origine, indépendamment des saisies.</p>
   <div class="rows">${t.map(x => `<div class="tst"><span class="id">${esc(x.id)}</span><div><div class="l">${esc(x.l)}</div><div class="o">${esc(x.origine)} · valeur obtenue ${fr(x.v, 3)}</div></div><span class="vd ${x.ok ? 'ok' : 'ko'}">${x.ok ? 'OK' : 'Écart'}</span></div>`).join('')}</div>
  </div>
 </div>`;
}

/* ---------- rendu ---------- */
const TABS = [['scenario', 'Scénario'], ['operations', 'Opérations'], ['baremes', 'Barèmes'], ['params', 'Paramètres et méthodes'], ['debit', 'Débit de chantier'], ['controles', 'Contrôles et tests']];
function render() {
  const res = Core.scenario(S.ref, S.opts, S.scen);
  const V = variantes();
  renderHead(res, V);
  const t = runTests(), badge = { operations: fr(S.ref.operations.length), controles: `${fr(t.filter(x => x.ok).length)}/${fr(t.length)}` };
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${k === S.tab}" data-tab="${k}">${esc(l)}${badge[k] ? `<span class="n">${badge[k]}</span>` : ''}</button>`).join('');
  const fn = { scenario: () => renderScenario(res, V), operations: renderOperations, baremes: renderBaremes, params: () => renderParams(V), debit: renderDebit, controles: renderControles }[S.tab];
  $('#main').innerHTML = fn();
  if (!dl) document.querySelectorAll('.dl').forEach(b => b.hidden = !fallbackDl);
}

/* ---------- édition ---------- */
function setPath(path, raw) {
  const [k, a, b] = path.split('.');
  const N = ['hMO', 'qIntrant', 'presta', 'nb', 'brut', 'charges', 'eurKg', 'prix', 'valeur', 'duree', 'heures', 'entretien', 'conso', 'autres', 'assurance'];
  const val = f => N.includes(f) ? parseNum(raw) : (raw === '' ? null : raw);
  if (k === 'p') S.ref.params[a] = parseNum(raw);
  else if (k === 'opts') S.opts[a] = ['machine', 'vendange', 'prix'].includes(a) ? raw : (parseNum(raw) ?? 0);
  else if (k === 'debit') { const v = parseNum(raw); if (v !== null && v >= 0) S.debit[a] = v; }
  else if (k === 'scen') { S.ref.scenarios[S.scen][+a][b] = b === 'nb' ? (parseNum(raw) ?? 0) : raw; }
  else if (k === 'op') {
    const op = S.ref.operations[+a];
    if (b === 'code') {
      const nv = String(raw).trim(); if (!nv) { toast('Le code ne peut pas être vide.'); return; }
      if (S.ref.operations.some((o, i) => i !== +a && o.code === nv)) { toast(`Le code ${nv} existe déjà.`); return; }
      Object.values(S.ref.scenarios).forEach(ls => ls.forEach(l => { if (l.code === op.code) l.code = nv; }));
      op.code = nv; toast('Code renommé, scénarios mis à jour.');
    } else op[b] = val(b);
  }
  else if (k === 'mo') S.ref.mo[+a][b] = val(b);
  else if (k === 'ma') S.ref.machines[+a][b] = val(b);
  else if (k === 'in') S.ref.intrants[+a][b] = val(b);
  save(); render();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'prof') { S.scen = t.value; save(); render(); return; }
  if (t.dataset.act === 'import') { importJson(t.files[0]); return; }
  if (t.dataset.filt) { S[t.dataset.filt] = t.value; render(); return; }
  if (t.dataset.path) setPath(t.dataset.path, t.value);
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; Object.assign(S, VOLATILE); save(); render(); return; }
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'chip') { const k = b.dataset.k; S.opts[k] = k === 'machine' ? (S.opts.machine === 'bareme' ? 'scenario' : 'bareme') : { fixe: 'productivite', productivite: 'tache', tache: 'fixe' }[S.opts.vendange]; }
  else if (a === 'opt') S.opts[b.dataset.k] = b.dataset.v;
  else if (a === 'cmp') { const v = b.dataset.v; S.opts.machine = v === 'scenario' ? 'scenario' : 'bareme'; S.opts.vendange = v === 'tache' ? 'tache' : 'fixe'; }
  else if (a === 'fac') { S.famille = S.famille === b.dataset.v ? '' : b.dataset.v; render(); return; }
  else if (a === 'sources') { S.sources = !S.sources; render(); return; }
  else if (a === 'sansSource') { S.sansSource = !S.sansSource; render(); return; }
  else if (a === 'sansPrix') { S.sansPrix = !S.sansPrix; S.intrTout = false; render(); return; }
  else if (a === 'intrTout') { S.intrTout = true; render(); return; }
  else if (a === 'print') { window.print(); return; }
  else if (a === 'addLine') { (S.ref.scenarios[S.scen] = S.ref.scenarios[S.scen] || []).push({ code: S.ref.operations[0].code, nb: 1 }); }
  else if (a === 'delLine') S.ref.scenarios[S.scen].splice(i, 1);
  else if (a === 'copyScen') S.ref.scenarios[S.scen] = clone(S.ref.scenarios.SC_2 || []);
  else if (a === 'addOp') { let n = 1; while (S.ref.operations.some(o => o.code === `NOUV_${n}`)) n++; S.ref.operations.unshift({ code: `NOUV_${n}`, famille: '', libelle: 'Nouvelle opération', mode: 'VE', org: 'Exploitation', codeMO: '', hMO: null, codeMach: '', intrant: '', qIntrant: null, presta: null, source: '' }); Object.assign(S, VOLATILE); }
  else if (a === 'dupOp') { const c = clone(S.ref.operations[i]); let n = 2; while (S.ref.operations.some(o => o.code === `${c.code}_${n}`)) n++; c.code = `${c.code}_${n}`; delete c.role; S.ref.operations.splice(i + 1, 0, c); }
  else if (a === 'delOp') S.ref.operations.splice(i, 1);
  else if (a === 'reset') { if (b.dataset.armed) { S.ref = clone(FACTORY); S.opts = { ...DEFAULT_OPTS }; S.debit = { ...DEFAULT_DEBIT }; toast("Valeurs d'origine restaurées."); } else { b.dataset.armed = 1; b.textContent = 'Confirmer : tout effacer'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Revenir aux valeurs d'origine"; } }, 4000); return; } }
  else if (a === 'csv') return exportCsv();
  else if (a === 'json') return saveFile(`referentiel_couts_champagne_${S.ref.version}.json`, JSON.stringify(S.ref, null, 1));
  else return;
  save(); render();
});
/* Retour immédiat : filtres et champs du débit de chantier, avec restitution du curseur. */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filt) {
    const k = t.dataset.filt, v = t.value, pos = t.selectionStart;
    clearTimeout(window._ft);
    window._ft = setTimeout(() => { S[k] = v; S.intrTout = false; render(); const f = document.querySelector(`[data-filt="${k}"]`); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) {} } }, 200);
  } else if (t.dataset.path && t.dataset.path.slice(0, 6) === 'debit.') {
    const p = t.dataset.path, v = t.value, pos = t.selectionStart;
    clearTimeout(window._dt);
    window._dt = setTimeout(() => { setPath(p, v); const f = document.querySelector(`[data-path="${p}"]`); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) {} } }, 250);
  }
});

/* ---------- fichiers ---------- */
let dl = null, fallbackDl = !(window.claude && window.claude.use);
if (window.claude && window.claude.use) window.claude.use('downloads').then(x => { dl = x; document.querySelectorAll('.dl').forEach(b => b.hidden = !dl); }).catch(() => {});
async function saveFile(name, data) {
  if (dl) { try { await dl.save({ filename: name, data }); toast('Fichier enregistré.'); } catch (e) { if (e && e.code !== 'declined') toast('Enregistrement impossible ici.'); } return; }
  if (fallbackDl) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
}
function exportCsv() {
  const res = Core.scenario(S.ref, S.opts, S.scen), n = v => fr(v, 2).replace(/ | /g, '');
  const rows = [['Scénario', 'Code', 'Opération', 'Passages', '€/ha', 'MO €/ha', 'Matériel €/ha', 'Intrants €/ha', 'Prestations €/ha', 'h MO/ha', 'h traction/ha']];
  res.lines.forEach(l => rows.push([S.scen, l.code, l.op ? l.op.libelle : 'code inconnu', l.nb, n(l.total), n(l.mo), n(l.mach), n(l.intr), n(l.presta), n(l.h), n(l.hMach)]));
  const s = res.synth; rows.push([S.scen, 'TOTAL', '', '', n(s.cout), n(s.mo), n(s.mach), n(s.intr), n(s.presta), n(s.hMO), n(s.hMach)]);
  rows.push([], ['Méthode matériel', S.opts.machine], ['Méthode cueillette', S.opts.vendange], ['Rendement kg/ha', S.ref.params.volume], ['Référentiel', S.ref.version]);
  saveFile(`couts_${S.scen}.csv`, '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n'));
}
function importJson(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { const j = JSON.parse(r.result); if (!Array.isArray(j.operations) || !Array.isArray(j.mo) || !Array.isArray(j.machines) || !Array.isArray(j.intrants) || !j.params || !j.scenarios) throw 0; S.ref = j; save(); render(); toast('Référentiel importé.'); } catch (e) { toast("Fichier non reconnu : il manque des sections du référentiel."); } };
  r.readAsText(file);
}
render();
</script>
</body>
</html>
